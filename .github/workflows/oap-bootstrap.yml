name: OAP bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  oap-bootstrap-acceptance:
    name: OAP bootstrap acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require Python 3.12 and tmux
        shell: bash
        run: |
          command -v python3.12
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          command -v tmux
          tmux -V

      - name: Resolve accepted baseline
        run: git cat-file -e 2832fa1e51bdf3641aabbd81feab8ddb64a876da^{commit}

      - name: Run bootstrap acceptance
        run: python3.12 -B -m unittest discover -s oap/tests -v

      - name: Check accepted runtime governance
        run: python3.12 oap/bin/check_governance.py --repo-root . --mode accepted-runtime --accepted-ref 2832fa1e51bdf3641aabbd81feab8ddb64a876da

      - name: Check committed transcript coherence
        shell: bash
        run: |
          expected_id="$(python3.12 - <<'PY'
          import re
          from pathlib import Path

          suffixes = tuple(chr(c) for c in range(ord('a'), ord('z') + 1))
          suffixes += tuple(a + b for a in suffixes for b in suffixes)
          found = []
          pattern = re.compile(r'([0-9]{3}-[a-z]{1,2})-[a-z0-9]+(?:-[a-z0-9]+)*\.md\Z')
          for path in Path('oap/orders').iterdir():
              match = pattern.fullmatch(path.name)
              if match:
                  objective, suffix = match[1].split('-', 1)
                  found.append((int(objective), suffixes.index(suffix), match[1]))
          if not found:
              raise SystemExit('no published order')
          print(max(found)[2])
          PY
          )"
          test -n "$expected_id"
          printf 'transcript expected id: %s\n' "$expected_id"
          python3.12 oap/bin/check_transcript.py --repo-root . --revision HEAD --expected-id "$expected_id"

      - name: Check whitespace
        run: git diff --check 2832fa1e51bdf3641aabbd81feab8ddb64a876da...HEAD

  oap-report-history:
    name: OAP report history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require Python 3.12
        run: |
          command -v python3.12
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Check report history
        run: python3.12 oap/bin/check_report_history.py --repo-root . --revision HEAD --require-manifest
