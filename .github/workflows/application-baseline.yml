name: Application baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-baseline:
    name: Application baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.10
          enable-cache: false

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Run native development baseline driver
        shell: bash
        run: |
          python312="$(uv python find 3.12)"
          "$python312" scripts/verify_development_baseline.py --temp-parent "$RUNNER_TEMP" --command-timeout 1800

      - name: Assert checkout has no temporary environment artifacts
        shell: bash
        run: |
          test ! -e .venv
          test ! -e dist
          test ! -e build
          test ! -e .cache
          test ! -e .pytest_cache
          test ! -e .ruff_cache
          test ! -e .mypy_cache

      - name: Check accepted-base whitespace
        run: python3.12 oap/bin/check_whitespace.py --base 82ea1e6f4173934fa47bb34ee6a6f78338d3603a --revision HEAD

      - name: Assert protected scientific surfaces are unchanged
        run: git diff --exit-code 4507cc78e333c0e48226b64266121171b7b8cea8 -- PLAN.md ARCHITECTURE.md CRITICAL.md oap/bootstrap-sources.lock.json docs/bootstrap

      - name: Candidate governance review bound to order 012-a
        run: python3.12 oap/bin/oap_cli.py candidate-review --repo-root . --order oap/orders/012-a-native-migration-and-merged-round-reconciliation.md --order-sha256 e320df8eb44e76877ec063abf5ca0bd6af6306684beb1bf985cfc25fafd22b34 --accepted-ref 4507cc78e333c0e48226b64266121171b7b8cea8 --order-id 012-a
