[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-slovenian-repair"
version = "0.0.0"
description = "Installable development skeleton for conservative Slovenian text repair."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "LLM Slovenian Repair contributors" }]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.13.5,<3",
]

[project.optional-dependencies]
morphology = []

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.6,<0.17",
]

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_slovenian_repair"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true
